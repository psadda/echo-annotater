name: Build installers

# Run it by hand (Actions tab > Build installers > Run workflow) or by pushing a version tag such as v0.1.0.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false  # a failure on one platform should not hide the result on the others
      matrix:
        include:
          - name: Windows
            runner: windows-latest
            platform: windows
            artifact: windows-x64
          - name: macOS (Apple Silicon)
            runner: macos-latest
            platform: macOS
            artifact: macos-arm64
            arch: arm64
          # GitHub's last Intel Mac image (offered until fall 2027). OpenCV is capped below 5.1 in pyproject.toml,
          # whose wheels need macOS 15; with 5.0 both Mac apps run on macOS 14 or newer.
          - name: macOS (Intel)
            runner: macos-15-intel
            platform: macOS
            artifact: macos-x86_64
            arch: x86_64

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync  # uv.lock is not committed, so this resolves the dependencies fresh

      # Briefcase builds for the machine it runs on, which is why there is one job per platform and architecture.
      - name: Create the app bundle
        run: uv run briefcase create ${{ matrix.platform }} --no-input

      - name: Build the app
        run: uv run briefcase build ${{ matrix.platform }} --no-input

      # --adhoc-sign builds without a code-signing certificate. The result runs, but Windows SmartScreen and
      # macOS Gatekeeper will warn the first time; see the README notes for how to open it anyway.
      - name: Package the installer
        run: uv run briefcase package ${{ matrix.platform }} --adhoc-sign --no-input

      # Both Mac builds produce a file with the same name, so say which architecture each one is for.
      - name: Add the architecture to the disk image name
        if: matrix.platform == 'macOS'
        shell: bash
        run: |
          for f in dist/*.dmg; do mv "$f" "${f%.dmg}-${{ matrix.arch }}.dmg"; done

      - uses: actions/upload-artifact@v4
        with:
          name: echo-annotator-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
